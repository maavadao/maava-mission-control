name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: App imports
        env:
          AUTH_MODE: local
          LOCAL_AUTH_TOKEN: ci-only-token-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
        run: uv run python -c "import app.main"

  tests:
    runs-on: ubuntu-latest
    # Known failures inherited from Barrsa; make this required once they are fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -q
